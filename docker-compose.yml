version: '3.8'

services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_DATABASE: springcare_technology
      MYSQL_USER: laravel_user
      MYSQL_PASSWORD: secret_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3308:3306"  # Maps host port 3308 to container port 3306
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network

  # 2. PHP / Laravel App Container
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: springcare_technology
      DB_USERNAME: laravel_user
      DB_PASSWORD: secret_password
    volumes:
      - ./PERSISTENCE/SpringCare_Technology:/var/www/html
      - ./docker/php/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - laravel_network

  # 3. Nginx Web Server Container
  webserver:
    image: nginx:alpine
    restart: always
    ports:
      - "8001:80" # Access your app at http://localhost:8001
    volumes:
      - ./PERSISTENCE/SpringCare_Technology:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel_network

volumes:
  db_data:

networks:
  laravel_network:
    driver: bridge